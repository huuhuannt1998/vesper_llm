services:
  redis:
    image: redis:7-alpine
    container_name: testbed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - testbed-network
    restart: unless-stopped
      
  postgres:
    image: postgres:15
    container_name: testbed-postgres
    environment:
      POSTGRES_DB: smart_home_testbed
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./cloud-server/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - testbed-network
    restart: unless-stopped
      
  cloud-server:
    build: ./cloud-server
    container_name: testbed-cloud-server
    depends_on:
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:secure_password@postgres/smart_home_testbed
      REDIS_URL: redis://redis:6379
      NGROK_AUTH_TOKEN: ${NGROK_AUTH_TOKEN:-2eEdMNa3XkIOw7CsHuV7crgAtbD_6hdTjRRUawk5bA2PTdWX5}
      NGROK_DOMAIN: ${NGROK_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      SMARTTHINGS_CLIENT_ID: ${SMARTTHINGS_CLIENT_ID}
      SMARTTHINGS_CLIENT_SECRET: ${SMARTTHINGS_CLIENT_SECRET}
      SMARTTHINGS_CALLBACK_CLIENT_ID: ${SMARTTHINGS_CALLBACK_CLIENT_ID}
      SMARTTHINGS_CALLBACK_CLIENT_SECRET: ${SMARTTHINGS_CALLBACK_CLIENT_SECRET}
    ports:
      - "8081:8080"
    networks:
      - testbed-network
    restart: unless-stopped
      
  ngrok:
    image: ngrok/ngrok:latest
    container_name: testbed-ngrok
    depends_on:
      - cloud-server
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTH_TOKEN:-2eEdMNa3XkIOw7CsHuV7crgAtbD_6hdTjRRUawk5bA2PTdWX5}
    command: "http cloud-server:8080 --url=vt-testbed-2025.ngrok.app"
    networks:
      - testbed-network
    restart: unless-stopped

  backend-console:
    build: ./backend-console
    container_name: testbed-backend-console
    depends_on:
      - redis
      - postgres
      - cloud-server
    environment:
      DATABASE_URL: postgresql://admin:secure_password@postgres/smart_home_testbed
      REDIS_URL: redis://redis:6379
      CLOUD_SERVER_URL: http://cloud-server:8080
      REACT_APP_API_URL: http://localhost:8088
    ports:
      - "3000:3000"  # React frontend
      - "8088:8088"  # Backend API + HELICs endpoints
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config:ro
    networks:
      - testbed-network
    restart: unless-stopped
      
  # Device Services
  thermostat:
    build: ./thermostat
    container_name: testbed-thermostat
    depends_on:
      - redis
      - postgres
      - cloud-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUD_SERVER_URL: http://cloud-server:8080
    ports:
      - "8005:8000"
    networks:
      - testbed-network
    restart: unless-stopped

  motion-sensor:
    build: ./motion-sensor
    container_name: testbed-motion-sensor
    depends_on:
      - redis
      - postgres
      - cloud-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUD_SERVER_URL: http://cloud-server:8080
      SENSOR_ZONES: M01,M02,M03,M04,M05,M06,M07,M08,M09,M10,M11,M12,M13,M14,M15,M16,M17,M18,M19,M20,M21,M22,M23,M24,M25,M26
    ports:
      - "8001:8000"
    networks:
      - testbed-network
    restart: unless-stopped

  item-sensor:
    build: ./item-sensor
    container_name: testbed-item-sensor
    depends_on:
      - redis
      - postgres
      - cloud-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUD_SERVER_URL: http://cloud-server:8080
      SENSOR_ITEMS: I01:oatmeal,I02:raisins,I03:bowl,I04:spoon,I05:water,I06:medicine_container,I07:plate,I08:cup
    ports:
      - "8002:8000"
    networks:
      - testbed-network
    restart: unless-stopped

  appliance-controller:
    build: ./appliance-controller
    container_name: testbed-appliance-controller
    depends_on:
      - redis
      - postgres
      - cloud-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUD_SERVER_URL: http://cloud-server:8080
      CONTROLLED_APPLIANCES: AD1-A:water_hot,AD1-B:water_cold,AD1-C:burner,D01:door,*:phone
    ports:
      - "8003:8000"
    networks:
      - testbed-network
    restart: unless-stopped

  casas-dataset-manager:
    build: ./casas-dataset-manager
    container_name: testbed-casas-dataset-manager
    depends_on:
      - redis
      - postgres
      - cloud-server
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLOUD_SERVER_URL: http://cloud-server:8080
      CASAS_GROUND_TRUTH_DIR: /app/data/casas_ground_truth
      VESPER_OUTPUT_DIR: /app/data/vesper_generated
      COMPARISON_OUTPUT_DIR: /app/data/comparisons
    ports:
      - "8004:8000"
    volumes:
      - ./data/casas_ground_truth:/app/data/casas_ground_truth:ro
      - casas-output:/app/data/vesper_generated
      - casas-comparisons:/app/data/comparisons
    networks:
      - testbed-network
    restart: unless-stopped
      
  environment-simulator:
    build: ./environment-simulator
    image: testbed-environment:latest
    command: echo "Base image built"
    networks:
      - testbed-network
      
networks:
  testbed-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
    
volumes:
  redis-data:
  postgres-data:
  casas-output:
  casas-comparisons:
